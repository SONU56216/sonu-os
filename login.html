<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — SONU OS</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">SO</div>
        <div>
          <div class="name">SONU OS</div>
          <div class="sub">Sign in to your workspace</div>
        </div>
      </div>
      <h1>Sign in</h1>
      <p class="lede">Use your email and password.</p>

      <div id="formError" class="form-error hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6" />
        </div>
        <button id="submitBtn" class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">
          Sign in
        </button>
      </form>

      <p class="auth-foot">
        <a href="#" id="forgotLink">Forgot password?</a> ·
        New here? <a href="./register.html">Create an account</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth, isFirebaseConfigMissing } from "./js/firebase.js";
    import { toast } from "./js/ui.js";
    import {
      signInWithEmailAndPassword, sendPasswordResetEmail,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const errBox = document.getElementById("formError");
    const btn = document.getElementById("submitBtn");

    if (isFirebaseConfigMissing()) {
      errBox.textContent = "Firebase is not configured yet. Edit js/firebase-config.js.";
      errBox.classList.remove("hidden");
      btn.disabled = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("hidden");
      btn.disabled = true; btn.textContent = "Signing in…";
      try {
        await signInWithEmailAndPassword(auth, form.email.value.trim(), form.password.value);
        location.replace("./dashboard.html");
      } catch (err) {
        errBox.textContent = friendlyAuthError(err);
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });

    document.getElementById("forgotLink").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      if (!email) { toast("Enter your email first", "We'll send a reset link to that address.", "warn"); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        toast("Reset email sent", `Check ${email} for the reset link.`, "success");
      } catch (err) {
        toast("Couldn't send reset", friendlyAuthError(err), "error");
      }
    });

    function friendlyAuthError(err) {
      const code = err?.code || "";
      const map = {
        "auth/invalid-email": "That email address doesn't look valid.",
        "auth/user-not-found": "No account found for that email.",
        "auth/wrong-password": "Incorrect password.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/too-many-requests": "Too many attempts. Try again later.",
        "auth/network-request-failed": "Network error. Check your connection.",
      };
      return map[code] || err?.message || "Sign-in failed.";
    }
  </script>
</body>
</html>
